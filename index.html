    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // This script takes the current URL and redirects it into the query string
      // so your router can pick it up.
      var pathSegmentsToKeep = 1; // Change to 1 if using a project repo path (e.g. username.github.io/repo-name/)

      var l = window.location;
      if (l.search[1] === "/") {
        var decoded = l.search
          .slice(1)
          .split("&")
          .map(function (s) {
            return s.replace(/~and~/g, "&");
          })
          .join("?");
        window.history.replaceState(
          null,
          null,
          l.pathname.slice(0, -1) + decoded + l.hash,
        );
      }
    </script>
